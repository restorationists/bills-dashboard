    <!-- Dark/Light favicon swap (works with prefers-color-scheme AND your manual 'dark' class) -->
    <script>
      (function () {
        const fav = () => document.getElementById("site-favicon");
        const prefers_dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const html_dark = document.documentElement.classList.contains("dark");
        const is_dark = html_dark || prefers_dark;

        const el = fav();
        if (el) el.href = is_dark ? "/favicon-dark.png" : "/favicon-light.png";

        // React to OS theme changes
        if (window.matchMedia) {
          const mq = window.matchMedia("(prefers-color-scheme: dark)");
          const on_change = () => {
            const html_is_dark = document.documentElement.classList.contains("dark");
            const now_dark = html_is_dark || mq.matches;
            const f = fav();
            if (f) f.href = now_dark ? "/favicon-dark.png" : "/favicon-light.png";
          };
          if (mq.addEventListener) mq.addEventListener("change", on_change);
          else if (mq.addListener) mq.addListener(on_change);
        }

        // React to manual toggles that add/remove the 'dark' class
        const obs = new MutationObserver(() => {
          const mq = window.matchMedia("(prefers-color-scheme: dark)");
          const html_is_dark = document.documentElement.classList.contains("dark");
          const now_dark = html_is_dark || (mq && mq.matches);
          const f = fav();
          if (f) f.href = now_dark ? "/favicon-dark.png" : "/favicon-light.png";
        });
        obs.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      })();
    </script>
